<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#17243b;--muted:#6b7890;--line:#e4eaf2;--blue:#315ee8;--nav:#111d36;--green:#13865e;--red:#c43d50;--amber:#a76609;--shadow:0 8px 28px #1b31500c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font-weight:650}.primary{background:var(--blue);color:white}.soft{background:#edf2ff;color:#244bd0}.plain{background:white;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0f1;color:var(--red)}.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.sidebar{background:var(--nav);color:#dce5f8;padding:24px 15px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 9px}.logo{width:38px;height:38px;border-radius:12px;background:#315ee8;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800}.brand strong{display:block;font-size:17px;color:white}.brand small{color:#9daecc}.navlabel{font-size:10px;letter-spacing:1.5px;color:#8191b0;padding:0 11px;margin-bottom:-13px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#b9c6df;text-align:left;font-weight:550;display:flex;gap:12px;align-items:center;padding:11px 12px}.nav button.active,.nav button:hover{background:#263553;color:white}.nav button span{width:19px;text-align:center}.sidebottom{margin-top:auto;border-top:1px solid #293651;padding:16px 8px;color:#9eacc7;font-size:12px}.main{min-width:0}.topbar{height:76px;background:#ffffffed;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:15px;position:sticky;top:0;z-index:5}.crumb{font-size:12px;color:var(--muted)}.topbar h1{font-size:19px;margin:2px 0 0}.topright{display:flex;gap:10px;align-items:center}.role{border:1px solid var(--line);background:white;border-radius:9px;padding:9px;color:var(--ink)}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#e7edff;color:#315ee8;font-weight:800}.content{padding:28px 30px;max-width:1500px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.welcome h2{margin:0;font-size:23px;letter-spacing:-.5px}.welcome p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:17px 18px}.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.statnum{font-size:28px;font-weight:800;margin:7px 0 3px;letter-spacing:-.8px}.statnote{font-size:11px;color:var(--muted)}.staticon{width:35px;height:35px;display:grid;place-items:center;background:#edf2ff;color:#315ee8;border-radius:10px;font-size:17px}.layout2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px}.panel{padding:19px;min-width:0}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panelhead h3{font-size:15px;margin:0}.panelhead p{font-size:12px;color:var(--muted);margin:3px 0 0}.linkbtn{background:transparent;color:var(--blue);padding:4px;font-size:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;font-size:11px;color:#77839a;font-weight:700;background:#f8faff;padding:11px 12px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid #edf0f5;font-size:12px}tbody tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:30px;padding:4px 8px;font-size:10px;font-weight:750;background:#edf2ff;color:#315ee8}.pill.green{background:#e5f7ee;color:#08764d}.pill.red{background:#fff0f1;color:#c43d50}.pill.amber{background:#fff5df;color:#a76609}.pill.gray{background:#edf0f4;color:#58647a}.barrow{display:grid;grid-template-columns:125px 1fr 30px;gap:10px;align-items:center;margin:16px 0;font-size:12px}.bar{height:8px;border-radius:8px;background:#edf0f5;overflow:hidden}.bar i{height:100%;display:block;background:#315ee8;border-radius:8px}.alertrow{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #edf0f5}.alertrow:last-child{border-bottom:0}.alertdot{width:8px;height:8px;border-radius:50%;background:#e7a02b;margin-top:6px;flex:none}.alertrow strong{font-size:12px;display:block}.alertrow small{font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.search{min-width:200px;flex:1;max-width:360px;border:1px solid var(--line);border-radius:9px;background:white;padding:10px 12px}.field{display:grid;gap:5px;margin-bottom:13px}.field label{font-size:12px;font-weight:700;color:#42506a}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3ee;border-radius:8px;padding:10px 11px;background:white;color:var(--ink);outline-color:#9db2ff}.field textarea{min-height:75px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.modalback{position:fixed;inset:0;background:#111d3680;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modalback.show{display:flex}.modal{background:white;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:22px;box-shadow:0 25px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0;font-size:18px}.close{background:#f0f3f8;color:#4e5b73;padding:6px 10px}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.empty{text-align:center;padding:34px 10px;color:var(--muted)}.toast{position:fixed;right:22px;bottom:22px;z-index:40;background:#14213a;color:white;padding:13px 17px;border-radius:11px;box-shadow:0 10px 30px #0002;display:none;max-width:380px}.toast.show{display:block}.notice{border:1px solid #f2d59a;background:#fff8e9;color:#82520b;border-radius:10px;padding:11px 13px;margin-bottom:17px;font-size:12px}.studentcard{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.studentcard:last-child{border-bottom:0}.mobilemenu{display:none}.footer{text-align:center;padding:25px;color:#8995a9;font-size:11px}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.layout2{grid-template-columns:1fr}.shell{grid-template-columns:205px 1fr}.content{padding:22px 18px}.topbar{padding:0 18px}}@media(max-width:700px){.shell{display:block}.sidebar{display:none}.topbar{height:68px;padding:0 14px}.mobilemenu{display:inline-block}.content{padding:18px 13px}.welcome{align-items:flex-start;flex-direction:column}.stats{gap:9px}.stat{padding:13px}.statnum{font-size:23px}.statnote{font-size:10px}.topbar h1{font-size:16px}.crumb{display:none}.topright{gap:5px}.role{max-width:150px;padding:8px 5px;font-size:11px}.formgrid{grid-template-columns:1fr}.panel{padding:13px}.welcome h2{font-size:21px}}
</style></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">I</div><div><strong>InventoryTrack</strong><small>Department operations</small></div></div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav"><button class="active" data-page="dashboard"><span>▦</span>Overview</button><button data-page="inventory"><span>▤</span>Inventory & assets</button><button data-page="students"><span>♙</span>Students</button><button data-page="issues"><span>⇄</span>Issue / return</button><button data-page="renewals"><span>◷</span>Renewal requests <b id="renewalBadge"></b></button><button data-page="reports"><span>▥</span>Reports & audit</button></nav><div class="sidebottom">InventoryTrack v1.0<br>15-day issue policy enabled</div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="plain mobilemenu" id="menuBtn">☰</button><div><div class="crumb">DEPARTMENT / INVENTORY MANAGEMENT</div><h1 id="pageTitle">Overview</h1></div></div><div class="topright"><select class="role" id="roleSelect" aria-label="Switch demo role"><option value="coordinator">Coordinator view</option><option value="student">Student view</option></select><div class="avatar" id="avatar">IC</div></div></header><div class="content" id="app"></div><div class="footer">InventoryTrack · Department Inventory and Student Item Issue Management</div></main></div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Add record</h3><button class="close" id="closeModal">✕</button></div><form id="modalForm"><div id="modalBody"></div><div class="modalfoot"><button type="button" class="plain" id="cancelModal">Cancel</button><button class="primary" type="submit" id="saveBtn">Save record</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(date,n)=>{const d=new Date(date+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const uid=prefix=>prefix+"-"+Math.random().toString(36).slice(2,8).toUpperCase();
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(d+"T12:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"—";
const seed=()=>{const assets=Array.from({length:10},(_,i)=>({id:"DB-"+String(i+1).padStart(3,"0"),serial:"SN-DB-"+String(i+1).padStart(4,"0"),location:"DFIS Lab 1",condition:"Usable",status:"Available"}));return {students:[{id:"ST-001",name:"Aarav Patel",enrolment:"DFIS2026001",programme:"M.Sc. DFIS",semester:"I",contact:"aarav@example.com"},{id:"ST-002",name:"Diya Shah",enrolment:"DFIS2026002",programme:"M.Sc. DFIS",semester:"I",contact:"diya@example.com"},{id:"ST-003",name:"Kabir Mehta",enrolment:"DFIS2026003",programme:"M.Sc. DFIS",semester:"I",contact:"kabir@example.com"}],items:[{id:"IT-001",code:"DEV-BOARD",name:"Development Board",category:"Development kit",description:"Reusable development board for lab work",make:"Generic / DB series",type:"asset",total:10,location:"DFIS Lab 1",assets:assets},{id:"IT-002",code:"USB-CABLE",name:"USB Cable",category:"Cable",description:"Reusable USB data cable",make:"USB-A to USB-C",type:"quantity",total:20,location:"Equipment Cupboard A",assets:[],condition:"Usable"},{id:"IT-003",code:"USB-ADAPTER",name:"USB Adapter",category:"Adapter",description:"Reusable USB adapter",make:"USB adapter",type:"quantity",total:8,location:"Equipment Cupboard A",assets:[],condition:"Usable"},{id:"IT-004",code:"LAPTOP",name:"Forensic Laptop",category:"Computer",description:"Lab laptop for approved exercises",make:"Lenovo",type:"asset",total:2,location:"DFIS Lab 2",assets:[{id:"LT-001",serial:"LEN-001",location:"DFIS Lab 2",condition:"Usable",status:"Available"},{id:"LT-002",serial:"LEN-002",location:"DFIS Lab 2",condition:"Usable",status:"Available"}]}],issues:[],renewals:[],audit:[],policies:{issueLimit:5,renewalLimit:2}}};
let db;try{db=JSON.parse(localStorage.getItem("inventoryTrackDB"))||seed()}catch(e){db=seed()}
let page="dashboard",role="coordinator",studentId="ST-001",filter="",modalAction=null;
function save(){localStorage.setItem("inventoryTrackDB",JSON.stringify(db))}
function audit(action,detail){db.audit.unshift({id:uid("LOG"),date:new Date().toISOString(),user:role==="coordinator"?"Inventory Coordinator":"Student Portal",action,detail});save()}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3400)}
function available(item){if(item.type==="asset")return item.assets.filter(a=>a.status==="Available"&&a.condition==="Usable").length;return Math.max(0,item.total-activeQty(item.id))}
function activeQty(itemId){return db.issues.filter(x=>x.itemId===itemId).reduce((s,x)=>s+x.outstanding,0)}
function issuedQty(itemId){return activeQty(itemId)}
function conditionCount(item,condition){return item.type==="asset"?item.assets.filter(a=>a.condition===condition).length:0}
function statusOf(issue){return issue.outstanding<=0?"Returned":issue.dueDate<today()?"Overdue":"Issued"}
function overdueDays(issue){return Math.max(0,Math.floor((new Date(today()+"T12:00:00")-new Date(issue.dueDate+"T12:00:00"))/86400000))}
function student(enrol){return db.students.find(s=>s.id===enrol)||db.students.find(s=>s.enrolment===enrol)}
function item(id){return db.items.find(i=>i.id===id)}
function pill(text,kind){return '<span class="pill '+(kind||"")+'">'+esc(text)+'</span>'}
function stat(label,value,note,icon){return '<div class="stat"><div class="stathead"><span>'+label+'</span><span class="staticon">'+icon+'</span></div><div class="statnum">'+value+'</div><div class="statnote">'+note+'</div></div>'}
function panel(title,subtitle,body,action){return '<section class="panel"><div class="panelhead"><div><h3>'+title+'</h3>'+(subtitle?'<p>'+subtitle+'</p>':"")+'</div>'+(action||"")+'</div>'+body+'</section>'}
function empty(msg){return '<div class="empty">'+msg+'</div>'}
function overdueRows(list){return list.length?'<div class="tablewrap"><table><thead><tr><th>STUDENT</th><th>ITEM</th><th>OUTSTANDING</th><th>DUE DATE</th><th>OVERDUE</th></tr></thead><tbody>'+list.map(x=>'<tr><td><b>'+esc(student(x.studentId)?.name||"Unknown")+'</b><br><span class="muted">'+esc(student(x.studentId)?.enrolment||"")+'</span></td><td>'+esc(item(x.itemId)?.name||"")+'</td><td>'+x.outstanding+'</td><td>'+fmt(x.dueDate)+'</td><td>'+pill(overdueDays(x)+" days","red")+'</td></tr>').join("")+'</tbody></table></div>':empty("No overdue items. Great work!")}
function issueRows(list,studentMode){return list.length?'<div class="tablewrap"><table><thead><tr><th>ITEM / ASSET</th><th>STUDENT</th><th>QTY OUT</th><th>ISSUED</th><th>DUE</th><th>STATUS</th>'+(studentMode?"":"<th>ACTION</th>")+'</tr></thead><tbody>'+list.map(x=>{const st=statusOf(x),it=item(x.itemId);return '<tr><td><b>'+esc(it?.name||"")+'</b><br><span class="muted">'+esc(x.assetId||it?.code||"")+'</span></td><td>'+esc(student(x.studentId)?.name||"")+'</td><td>'+x.outstanding+'</td><td>'+fmt(x.issueDate)+'</td><td>'+fmt(x.dueDate)+'</td><td>'+pill(st,st==="Overdue"?"red":st==="Returned"?"green":"amber")+'</td>'+(studentMode?"":'<td><button class="soft" data-return="'+x.id+'" '+(x.outstanding===0?"disabled":"")+'>Return</button></td>')+'</tr>'}).join("")+'</tbody></table></div>':empty("No issue records yet.")}
function inventoryRows(list){return list.length?'<div class="tablewrap"><table><thead><tr><th>ITEM</th><th>TYPE</th><th>LOCATION</th><th>TOTAL</th><th>AVAILABLE</th><th>ISSUED</th><th>UNAVAILABLE</th><th>ACTION</th></tr></thead><tbody>'+list.map(x=>'<tr><td><b>'+esc(x.name)+'</b><br><span class="muted">'+esc(x.code)+' · '+esc(x.category)+'</span></td><td>'+pill(x.type==="asset"?"Tracked assets":"Quantity-based",x.type==="asset"?"":"gray")+'</td><td>'+esc(x.location)+'</td><td>'+x.total+'</td><td><b>'+available(x)+'</b></td><td>'+issuedQty(x.id)+'</td><td>'+(x.type==="asset"?x.assets.filter(a=>a.status!=="Available").length:Math.max(0,x.total-available(x)-issuedQty(x.id)))+'</td><td><button class="plain" data-edititem="'+x.id+'">Manage</button></td></tr>').join("")+'</tbody></table></div>':empty("No inventory items match your search.")}
function renderDashboard(){const all=db.issues.filter(x=>x.outstanding>0),over=all.filter(x=>statusOf(x)==="Overdue"),due=all.filter(x=>x.dueDate>=today()&&x.dueDate<=addDays(today(),7));const total=db.items.reduce((s,i)=>s+i.total,0),avail=db.items.reduce((s,i)=>s+available(i),0),issued=all.reduce((s,i)=>s+i.outstanding,0),unavailable=db.items.reduce((s,i)=>s+(i.type==="asset"?i.assets.filter(a=>a.status!=="Available").length:Math.max(0,i.total-available(i)-issuedQty(i.id))),0);
const chart=db.items.map(i=>'<div class="barrow"><span>'+esc(i.name)+'</span><div class="bar"><i style="width:'+Math.round((i.total?available(i)/i.total:0)*100)+'%"></i></div><b>'+available(i)+'</b></div>').join("");
const activity=db.audit.slice(0,5).map(a=>'<div class="alertrow"><div class="alertdot" style="background:#315ee8"></div><div><strong>'+esc(a.action)+'</strong><small>'+esc(a.detail)+' · '+new Date(a.date).toLocaleString()+'</small></div></div>').join("");
return '<div class="welcome"><div><h2>Good '+(new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening')+', '+(role==="coordinator"?'Coordinator':'Student')+' 👋</h2><p>Here’s what’s happening with your department inventory today.</p></div><div class="actions">'+(role==="coordinator"?'<button class="plain" data-go="reports">↧ Export reports</button><button class="primary" data-modal="issue">＋ Issue an item</button>':'<button class="primary" data-modal="renewal">＋ Request renewal</button>')+'</div></div>'+(role==="student"?'<div class="notice">Student portal demo: choose your student record below. You can view your borrowing history and request renewals.</div><div class="toolbar"><select class="search" id="studentPick">'+db.students.map(s=>'<option value="'+s.id+'" '+(s.id===studentId?'selected':'')+'>'+esc(s.name)+' — '+esc(s.enrolment)+'</option>').join("")+'</select></div>':"")+'<div class="stats">'+stat("TOTAL STOCK UNITS",total,"Across all inventory categories","▤")+stat("AVAILABLE NOW",avail,Math.round(avail/(total||1)*100)+"% of total stock","✓")+stat("CURRENTLY ISSUED",issued,"Items with students","⇄")+stat("OVERDUE ITEMS",over.reduce((s,x)=>s+x.outstanding,0),over.length+" overdue issue records","◷")+'</div><div class="layout2">'+panel("Stock availability","Available units by inventory item",chart||empty("Add inventory to see availability."),'<button class="linkbtn" data-go="inventory">View inventory →</button>')+panel(role==="coordinator"?"Needs attention":"Your borrowing","Due soon and overdue items",role==="coordinator"?(over.length?over.slice(0,4).map(x=>'<div class="alertrow"><div class="alertdot"></div><div><strong>'+esc(student(x.studentId)?.name||"Student")+' · '+esc(item(x.itemId)?.name||"item")+'</strong><small>'+x.outstanding+' outstanding · due '+fmt(x.dueDate)+' · '+overdueDays(x)+' days overdue</small></div></div>').join(""):empty("No overdue issues.")):issueRows(db.issues.filter(x=>x.studentId===studentId&&x.outstanding>0),true),'<button class="linkbtn" data-go="'+(role==="coordinator"?"issues":"issues")+'">View all →</button>')+'</div><div class="layout2">'+panel("Upcoming due dates","Items due in the next 7 days",due.length?due.map(x=>'<div class="alertrow"><div class="alertdot" style="background:#315ee8"></div><div><strong>'+esc(item(x.itemId)?.name||"")+' · '+esc(student(x.studentId)?.name||"")+'</strong><small>'+x.outstanding+' outstanding · due '+fmt(x.dueDate)+'</small></div></div>').join(""):empty("No upcoming due dates."))+panel("Recent activity","Latest recorded actions",activity||empty("Activity appears here after the first transaction."))+'</div>'}
function renderInventory(){return '<div class="welcome"><div><h2>Inventory & assets</h2><p>Track reusable stock, individually tagged assets, condition and storage location.</p></div><div class="actions"><button class="plain" data-modal="stock">＋ Stock adjustment</button><button class="primary" data-modal="item">＋ Add inventory item</button></div></div><div class="stats">'+stat("INVENTORY TYPES",db.items.length,"Registered catalogue entries","▤")+stat("ASSET TAGS",db.items.reduce((s,i)=>s+(i.type==="asset"?i.assets.length:0),0),"Individually tracked units","⌗")+stat("DAMAGED",db.items.reduce((s,i)=>s+conditionCount(i,"Damaged"),0),"Tagged assets marked damaged","⚠")+stat("MAINTENANCE",db.items.reduce((s,i)=>s+conditionCount(i,"Maintenance"),0),"Tagged assets under repair","⚙")+'</div><div class="toolbar"><input id="searchInventory" class="search" placeholder="Search item, code, category or location..." value="'+esc(filter)+'"><select id="typeFilter" class="role"><option value="">All tracking types</option><option value="asset">Individually tracked</option><option value="quantity">Quantity-based</option></select></div>'+panel("Inventory register",db.items.length+" catalogue items",inventoryRows(db.items.filter(i=>(i.name+" "+i.code+" "+i.category+" "+i.location).toLowerCase().includes(filter.toLowerCase())&&(!$("#typeFilter")||!$("#typeFilter").value||i.type===$("#typeFilter").value))))}
function renderStudents(){return '<div class="welcome"><div><h2>Registered students</h2><p>Only registered students can receive inventory items.</p></div><button class="primary" data-modal="student">＋ Register student</button></div>'+panel("Student directory",db.students.length+" registered students",db.students.length?'<div class="tablewrap"><table><thead><tr><th>STUDENT</th><th>ENROLMENT</th><th>PROGRAMME</th><th>SEMESTER</th><th>CONTACT</th><th>ACTIVE ITEMS</th></tr></thead><tbody>'+db.students.map(s=>'<tr><td><b>'+esc(s.name)+'</b></td><td>'+esc(s.enrolment)+'</td><td>'+esc(s.programme)+'</td><td>'+esc(s.semester)+'</td><td>'+esc(s.contact)+'</td><td>'+db.issues.filter(x=>x.studentId===s.id&&x.outstanding>0).reduce((n,x)=>n+x.outstanding,0)+'</td></tr>').join("")+'</tbody></table></div>':empty("No students registered."))}
function renderIssues(){let list=db.issues.filter(x=>role!=="student"||x.studentId===studentId);return '<div class="welcome"><div><h2>Issue & return desk</h2><p>Every issue has a 15-calendar-day due date. Record returns and condition before stock becomes available.</p></div><div class="actions">'+(role==="coordinator"?'<button class="primary" data-modal="issue">＋ Issue items</button>':'')+'</div></div><div class="stats">'+stat("ACTIVE ISSUE RECORDS",list.filter(x=>x.outstanding>0).length,"Not fully returned","⇄")+stat("UNITS OUT",list.reduce((s,x)=>s+x.outstanding,0),"Outstanding quantity","▤")+stat("OVERDUE RECORDS",list.filter(x=>statusOf(x)==="Overdue").length,"Past due date","◷")+stat("RETURNED RECORDS",list.filter(x=>x.outstanding===0).length,"Fully returned","✓")+'</div>'+panel("Issue register","Searchable issue and return history",issueRows(list,role==="student"))}

function render(){const titles={dashboard:"Overview",inventory:"Inventory & assets",students:"Students",issues:"Issue / return",renewals:"Renewal requests",reports:"Reports & audit"};$("#pageTitle").textContent=titles[page]||"Overview";$("#avatar").textContent=role==="coordinator"?"IC":"ST";$("#renewalBadge").textContent=db.renewals.filter(r=>r.status==="Pending").length||"";$("#nav").style.display=role==="student"?"grid":"grid";$$('#nav button').forEach(b=>{b.classList.toggle("active",b.dataset.page===page);b.style.display=role==="student"&&["inventory","students","reports"].includes(b.dataset.page)?"none":""});$("#app").innerHTML=({dashboard:renderDashboard,inventory:renderInventory,students:renderStudents,issues:renderIssues,renewals:renderRenewals,reports:renderReports}[page]||renderDashboard)();bindDynamic()}

outstanding:qty,purpose:d.purpose,issueDate:d.issueDate,dueDate:addDays(d.issueDate,15),staff:d.staff,returns:[]});audit("Item issued",st.name+" received "+qty+" × "+it.name+"; due "+addDays(d.issueDate,15));save();go("issues");toast("Issue recorded. Due date: "+fmt(addDays(d.issueDate,15))+".");},"Issue item");if($("#itemId"))$("#itemId").addEventListener("change",updateAssetFields);if($("#issueDate"))$("#issueDate").addEventListener("change",updateDue);if($("#quantity"))$("#quantity").addEventListener("input",updateAssetFields);}
else if(type==="renewal"){const owned=db.issues.filter(x=>x.studentId===studentId&&x.outstanding>0);openModal("Request renewal",owned.length?'<div class="notice">A request alone does not extend the due date. The coordinator must approve it.</div>'+fsel("Issue to renew","issueId",owned.map(x=>({id:x.id,name:(item(x.itemId)?.name||"Item")+" · due "+fmt(x.dueDate)+" · outstanding "+x.outstanding})) .map(x=>({id:x.id,name:x.name})))+field("Request date","requestDate","date",true,null,today())+field("Reason","reason","textarea",true):empty("You have no outstanding items to renew."),d=>{const issue=db.issues.find(x=>x.id===d.issueId);if(!issue||issue.outstanding<1)throw Error("Choose an active issue.");if(d.requestDate>issue.dueDate)throw Error("Renewal requests must be made by the due date.");if(db.renewals.filter(r=>r.issueId===issue.id&&r.status==="Approved").length>=Number(db.policies.renewalLimit))throw Error("Maximum approved renewals reached.");if(db.renewals.some(r=>r.issueId===issue.id&&r.status==="Pending"))throw Error("A pending request already exists for this issue.");db.renewals.unshift({id:uid("REN"),issueId:issue.id,studentId:issue.studentId,itemId:issue.itemId,requestDate:d.requestDate,reason:d.reason,status:"Pending",remarks:"",staff:""});audit("Renewal requested",(student(issue.studentId)?.name||"Student")+" requested renewal for "+(item(issue.itemId)?.name||"item"));save();go("renewals");toast("Renewal request submitted. Due date unchanged until approval.");},"Submit request");}
else if(type==="stock"){openModal("Stock adjustment",'<div class="notice">Record new stock or a correction with a reason. This adjustment is added to the audit trail.</div>'+fsel("Inventory item","itemId",itemOpts)+fsel("Adjustment type","adjustType",[{value:"add",label:"Add new usable stock"},{value:"remove",label:"Remove / retire stock"}])+field("Quantity","quantity","number",true,null,"1")+field("Reason","reason","textarea",true),d=>{const it=item(d.itemId),n=Number(d.quantity);if(!it||!Number.isInteger(n)||n<1)throw Error("Choose an item and enter a positive whole quantity.");if(d.adjustType==="add"){it.total+=n;if(it.type==="asset")for(let i=0;i<n;i++)it.assets.push({id:it.code+"-"+uid("AS"),serial:"",location:it.location,condition:"Usable",status:"Available"});}else{if(n>available(it))throw Error("Cannot remove more than available usable stock.");if(it.type==="asset"){let left=n;for(const a of it.assets){if(left&&a.status==="Available"&&a.condition==="Usable"){a.status="Retired";a.condition="Retired";left--}}}it.total-=n;}audit("Stock adjustment",it.name+": "+(d.adjustType==="add"?"+":"-")+n+"; reason: "+d.reason);save();go("inventory");toast("Stock adjustment recorded.")});}
else if(type==="return"){const issue=db.issues.find(x=>x.id===id);if(!issue)return;const it=item(issue.itemId);openModal("Record item return",'<div class="notice">Returned stock becomes available only after receipt and condition are recorded.</div><p><b>'+esc(it.name)+'</b> · '+esc(student(issue.studentId)?.name||"")+' · outstanding '+issue.outstanding+'</p>'+field("Quantity returned","quantity","number",true,null,String(issue.outstanding))+field("Actual return date","returnDate","date",true,null,today())+fsel("Condition on return","condition",[{value:"Usable",label:"Usable — return to stock"},{value:"Damaged",label:"Damaged — unavailable"},{value:"Maintenance",label:"Needs maintenance — unavailable"},{value:"Lost",label:"Lost — unavailable"}])+field("Receiving staff member","staff","text",true,null,"Inventory Coordinator")+field("Notes","notes","textarea",false),d=>{const n=Number(d.quantity);if(!Number.isInteger(n)||n<1||n>issue.outstanding)throw Error("Return quantity must be between 1 and "+issue.outstanding+".");if(d.returnDate>today())throw Error("Return date cannot be in the future.");if(it.type==="asset"&&n!==1)throw Error("A tracked asset is returned one at a time.");issue.outstanding-=n;issue.returns=issue.returns||[];issue.returns.push({date:d.returnDate,quantity:n,condition:d.condition,staff:d.staff,notes:d.notes});if(it.type==="asset"){const a=it.assets.find(a=>a.id===issue.assetId);if(a){a.condition=d.condition;a.status=d.condition==="Usable"?"Available":d.condition==="Lost"?"Lost":d.condition==="Damaged"?"Damaged":"Maintenance";}}else if(d.condition!=="Usable"){it.total=Math.max(0,it.total-n);it.unavailableCount=(it.unavailableCount||0)+n;}audit("Item returned",student(issue.studentId)?.name+" returned "+n+" × "+it.name+"; condition: "+d.condition);save();go("issues");toast("Return recorded with condition "+d.condition+".");},"Record return");}
else if(type==="edititem"){const it=item(id);if(!it)return;const assetOptions=it.type==="asset"?'<div class="field"><label>Individual asset status / condition</label><div class="tablewrap"><table><thead><tr><th>ASSET ID</th><th>SERIAL</th><th>CONDITION</th><th>STATUS</th><th>UPDATE</th></tr></thead><tbody>'+it.assets.map(a=>'<tr><td>'+esc(a.id)+'</td><td>'+esc(a.serial||"—")+'</td><td>'+esc(a.condition)+'</td><td>'+esc(a.status)+'</td><td><button type="button" class="soft" data-assetupdate="'+esc(a.id)+'" data-itemid="'+it.id+'">Update</button></td></tr>').join("")+'</tbody></table></div></div>':"";openModal("Manage "+it.name,'<div class="formgrid">'+field("Item name","name","text",true,null,it.name)+field("Category","category","text",true,null,it.category)+field("Make / model","make","text",false,null,it.make)+field("Storage location","location","text",true,null,it.location)+field("Description","description","textarea",false,null,it.description||"")+'</div>'+assetOptions+(it.type==="quantity"?'<div class="field"><label>Total quantity</label><input name="total" type="number" min="'+issuedQty(it.id)+'" value="'+it.total+'"></div>':""),d=>{it.name=d.name;it.category=d.category;it.make=d.make;it.location=d.location;it.description=d.description;if(it.type==="quantity"){const n=Number(d.total);if(n<issuedQty(it.id))throw Error("Total quantity cannot be less than outstanding quantity.");it.total=n;}audit("Inventory item updated",it.name+" details updated");save();go("inventory");toast("Inventory item updated.")},"Save changes");}
